spin_manifest_version = 2

[application]
authors = ["{{authors}}"]
description = "{{project-description}}"
name = "{{project-name}}"
version = "0.1.0"
targets = [{ url = "https://raw.githubusercontent.com/vdice/spin-environments/refs/heads/add-akamai-functions/envs/akamai-functions/akamai-functions%401.0.toml" }]

[[trigger.http]]
route = "{{http-path}}"
component = "{{project-name | kebab_case}}"

[component.{{project-name | kebab_case}}]
source = "app.wasm"
[component.{{project-name | kebab_case}}.build]
command = "componentize-py -w akamai:functions/http-trigger@1.0.0 -d wit/ componentize app -o app.wasm"
watch = ["*.py", "requirements.txt"]
